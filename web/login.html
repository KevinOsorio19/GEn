<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso · Flota PROING</title><link rel="stylesheet" href="/style.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(100%,440px);padding:32px}.login form{display:grid;gap:18px}.login h1{font-size:1.6rem}.login p{line-height:1.6}</style></head><body><section class="card login"><h1 id="login-title">Entrar a Flota PROING</h1><p id="login-help">Tus datos y cambios se guardan en tu perfil.</p><form id="login-form"><label>Usuario<input name="username" autocomplete="username" required minlength="3" maxlength="60" pattern="[a-zA-Z0-9._-]+"></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="200"></label><label id="confirm-label" hidden>Repetir contraseña<input name="confirm" type="password" autocomplete="new-password" maxlength="200"></label><div id="login-error" role="alert"></div><button class="primary" id="login-submit">Entrar</button></form><p><a href="/login.html">Volver al inicio de sesión</a></p></section><script src="/login.js" type="module"></script></body></html>
